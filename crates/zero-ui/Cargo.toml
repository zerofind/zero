[package]
name = "zero-ui"
version.workspace = true
edition = "2024"

[lib]
name = "zero_ui"
path = "src/lib.rs"

[[bin]]
name = "zero-app"
path = "src/main.rs"

[[bin]]
name = "design-system"
path = "src/bin/design_system.rs"

[dependencies]
zero = { path = "../.." }
zero-watcher = { path = "../watcher" }
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5.1"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
csv = "1"
tokio = { version = "1", features = ["rt"] }
natord = "1"
git2 = { version = "0.20", default-features = false }
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "9d9640d4" }
futures = "0.3"
parking_lot = "0.12"
smol = "2"
zero-mcp = { path = "../zero-mcp" }
zero-llm = { path = "../zero-llm" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }
