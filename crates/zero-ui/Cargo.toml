[package]
name = "zero-ui"
version.workspace = true
edition = "2024"

[lib]
name = "zero_ui"
path = "src/lib.rs"

[[bin]]
name = "zero-app"
path = "src/main.rs"

[[bin]]
name = "design-system"
path = "src/bin/design_system.rs"

[dependencies]
zero = { path = "../.." }
zero-watcher = { path = "../watcher" }
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
trash = "5.2"
csv = "1"
tokio = { version = "1", features = ["rt"] }

# objc2 dependencies removed until API integration is ready
# [target.'cfg(target_os = "macos")'.dependencies]
# objc2 = "0.6"
# objc2-foundation = "0.3"
# objc2-app-kit = "0.3"
