[package]
name = "zero-watcher"
version = "0.1.0"
edition = "2021"
description = "File system and USB mount watching for zero"
license = "MIT"

[lib]
name = "zero_watcher"
# Future: add "cdylib" for Swift FFI
crate-type = ["lib"]

[[bin]]
name = "zero-watch"
path = "src/bin/watch.rs"

[dependencies]
# File system watching
notify = "8.2"
notify-debouncer-mini = "0.7"

# Async runtime
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI for test binary
clap = { version = "4.5", features = ["derive"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS frameworks for USB detection
core-foundation = { version = "0.10", features = ["uuid"] }
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = "3.13"

