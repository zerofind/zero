[package]
name = "zero-watcher"
version.workspace = true
edition = "2024"
description = "File system and USB mount watching for zero"
license.workspace = true

[lints]
workspace = true

[lib]
name = "zero_watcher"
# Future: add "cdylib" for Swift FFI
crate-type = ["lib"]

[[bin]]
name = "zero-watch"
path = "src/bin/watch.rs"

[dependencies]
# File system watching
notify = "8.2"
notify-debouncer-mini = "0.7"

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI for test binary
clap = { workspace = true }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Channels
crossfire = { workspace = true, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS frameworks for USB detection
core-foundation = { version = "0.10", features = ["uuid"] }
core-foundation-sys = "0.8"

[dev-dependencies]
tempfile = { workspace = true }

