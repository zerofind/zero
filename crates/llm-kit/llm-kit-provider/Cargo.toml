[package]
name = "llm-kit-provider"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Provider interface and traits for the LLM Kit - defines the contract for implementing AI model providers"
keywords = ["ai", "llm", "provider", "trait", "interface"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
regex = "1.12.2"
async-trait = "0.1.89"
futures = "0.3.31"
serde_json = "1.0.145"
url = { version = "2.5.7", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.42"
tokio = "1.48.0"
base64 = "0.22.1"
tokio-util = "0.7.16"
thiserror = "2.0.9"
