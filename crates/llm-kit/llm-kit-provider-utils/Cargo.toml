[package]
name = "llm-kit-provider-utils"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared utilities for LLM Kit providers"
keywords = ["ai", "utilities", "sdk", "provider"]
categories = ["api-bindings"]

[dependencies]
llm-kit-provider = { path = "../llm-kit-provider" }
tokio-util = "0.7.16"
async-stream = "0.3"
futures-util = "0.3"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.41", features = ["macros", "rt"] }
