[package]
name = "zero-llm"
version.workspace = true
edition = "2024"

[dependencies]
zero = { path = "../.." }

# llm-kit (vendored)
llm-kit-core = { path = "../llm-kit/llm-kit-core" }
llm-kit-provider = { path = "../llm-kit/llm-kit-provider" }
llm-kit-provider-utils = { path = "../llm-kit/llm-kit-provider-utils" }
llm-kit-anthropic = { path = "../llm-kit/llm-kit-anthropic" }
llm-kit-openai-compatible = { path = "../llm-kit/llm-kit-openai-compatible" }

tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
futures-util = "0.3"
thiserror = "2.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "6"
