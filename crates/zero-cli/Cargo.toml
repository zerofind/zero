[package]
name = "zero-cli"
version.workspace = true
edition = "2024"
rust-version = "1.92"
description = "CLI binary for zero - resilient file sync"
license.workspace = true

[[bin]]
name = "zero"
path = "src/main.rs"

[dependencies]
zero = { path = "../.." }
zero-ui = { path = "../zero-ui" }

clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dirs = "6.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["rt", "rt-multi-thread", "macros"] }
zero-watcher = { path = "../watcher" }

[features]
default = []
opendal = ["zero/opendal"]
